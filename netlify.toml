[build]
  command = "node scripts/build-function-config.mjs && npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_URL = ""
  NEXT_PUBLIC_BACKEND_WEBHOOK_URL = "/webhooks/whatsapp"

# Nest core optionally requires microservices; keep it out of the bundle so
# esbuild does not walk into its optional transports (kafkajs, amqplib, ...).
[functions]
  external_node_modules = ["@nestjs/microservices"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/webhooks/*"
  to = "/.netlify/functions/api"
  status = 200